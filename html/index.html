<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>主網頁</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      padding-top: 80px;
      background: #f5f6f8;
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
      transition: background .3s, color .3s;
    }

    /* Navbar */
    .navbar {
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
    }

    /* Carousel */
    .carousel {
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 30px rgba(0,0,0,.25);
    }

    .carousel-item img {
      height: 420px;
      object-fit: cover;
    }

    /* Cards */
    .card {
      border: none;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,.12);
      transition: transform .3s ease, box-shadow .3s ease;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 18px 40px rgba(0,0,0,.25);
    }

    .card-img-top {
      height: 220px;
      object-fit: cover;
    }

    .card-title {
      font-weight: 700;
      letter-spacing: 1px;
    }

    .card-text {
      color: #555;
      line-height: 1.7;
      font-size: .95rem;
    }

    /* 🌙 深色模式 */
    body.dark-mode {
      background: #121212;
      color: #e0e0e0;
    }

    body.dark-mode .navbar {
      background-color: #000 !important;
    }

    body.dark-mode .card {
      background: #1f1f1f;
      color: #e0e0e0;
    }

    body.dark-mode .card-text {
      color: #ccc;
    }

    body.dark-mode .carousel {
      box-shadow: 0 15px 30px rgba(255,255,255,.1);
    }
  </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">主網頁</a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item">
          <a class="nav-link" href="page2.html">第二網頁</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="page3.html">第三網頁</a>
        </li>
        <li class="nav-item ms-3">
          <button id="themeBtn" class="btn btn-outline-light btn-sm">
            🌙 深色模式
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Carousel -->
<div class="container">
  <div id="carouselExample" class="carousel slide mb-5" data-bs-ride="carousel">

    <div class="carousel-indicators">
      <button data-bs-target="#carouselExample" data-bs-slide-to="0" class="active"></button>
      <button data-bs-target="#carouselExample" data-bs-slide-to="1"></button>
      <button data-bs-target="#carouselExample" data-bs-slide-to="2"></button>
      <button data-bs-target="#carouselExample" data-bs-slide-to="3"></button>
      <button data-bs-target="#carouselExample" data-bs-slide-to="4"></button>
    </div>

    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="01.jpg" class="d-block w-100">
      </div>
      <div class="carousel-item">
        <img src="02.jpg" class="d-block w-100">
      </div>
      <div class="carousel-item">
        <img src="03.jpg" class="d-block w-100">
      </div>
      <div class="carousel-item">
        <img src="04.jpg" class="d-block w-100">
      </div>
      <div class="carousel-item">
        <img src="05.jpg" class="d-block w-100">
      </div>
    </div>

    <button class="carousel-control-prev" data-bs-target="#carouselExample" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" data-bs-target="#carouselExample" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>

  </div>
</div>

<!-- Cards -->
<div class="container my-5">
  <h2 class="text-center fw-bold mb-4">動物介紹</h2>

  <div class="row g-4">

    <div class="col-md-4 col-sm-6">
      <div class="card h-100">
        <img src="06.jpg" class="card-img-top">
        <div class="card-body">
          <h5 class="card-title">大嘴鳥</h5>
          <p class="card-text">
            大巨嘴鳥擁有巨大而輕盈的喙，
            是熱帶雨林中最具代表性的鳥類之一。
          </p>
        </div>
      </div>
    </div>

    <div class="col-md-4 col-sm-6">
      <div class="card h-100">
        <img src="7.jpg" class="card-img-top">
        <div class="card-body">
          <h5 class="card-title">北極狐</h5>
          <p class="card-text">
            北極狐能在極地嚴寒環境生存，
            毛色會隨季節變化以利隱蔽。
          </p>
        </div>
      </div>
    </div>

    <div class="col-md-4 col-sm-6">
      <div class="card h-100">
        <img src="8.jpg" class="card-img-top">
        <div class="card-body">
          <h5 class="card-title">熊貓</h5>
          <p class="card-text">
            熊貓以竹子為主食，
            外型可愛，是全球保育象徵之一。
          </p>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- 🌙 深色模式切換 -->
<script>
  const btn = document.getElementById("themeBtn");

  btn.addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");

    btn.textContent =
      document.body.classList.contains("dark-mode")
        ? "☀️ 亮色模式"
        : "🌙 深色模式";
  });
</script>

</body>
</html>
