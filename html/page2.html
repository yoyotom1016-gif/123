<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>第二網頁</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      padding-top: 80px;
      background: linear-gradient(135deg, #eef2f7, #ffffff);
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
    }

    /* Navbar */
    .navbar {
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
    }

    /* Section card */
    .section-card {
      background: #fff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,.12);
      margin-bottom: 30px;
    }

    /* Accordion */
    .accordion-button {
      font-weight: 600;
    }

    /* Smooth animation */
    .collapse,
    .accordion-collapse {
      transition: all .3s ease;
    }
  </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">主網頁</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav2">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav2">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="page3.html">第三網頁</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container">

  <!-- Collapse 區塊 -->
  <div class="section-card">
    <h4 class="fw-bold mb-3">📌 課程說明</h4>

    <button class="btn btn-success mb-3" data-bs-toggle="collapse" data-bs-target="#collapseExample">
      顯示 / 隱藏說明
    </button>

    <div class="collapse" id="collapseExample">
      <div class="card card-body">
        本頁示範 Bootstrap 常見互動元件，
        包含 Collapse、Accordion 與 JavaScript 搜尋功能，
        適合用於作業、專題展示或實用型網站。
      </div>
    </div>
  </div>

  <!-- 搜尋功能 -->
  <div class="section-card">
    <h4 class="fw-bold mb-3">🔍 搜尋內容</h4>
    <input type="text" id="searchInput" class="form-control"
           placeholder="輸入關鍵字（例如：Bootstrap、功能）">
  </div>

  <!-- Accordion -->
  <div class="section-card">
    <h4 class="fw-bold mb-3">📂 功能介紹</h4>

    <div class="accordion" id="accordionExample">

      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#a1">
            Bootstrap 是什麼？
          </button>
        </h2>
        <div id="a1" class="accordion-collapse collapse show">
          <div class="accordion-body">
            Bootstrap 是一套前端 UI 框架，
            提供大量現成元件與排版系統，
            可快速製作響應式網頁。
          </div>
        </div>
      </div>

      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#a2">
            為什麼使用 Bootstrap？
          </button>
        </h2>
        <div id="a2" class="accordion-collapse collapse">
          <div class="accordion-body">
            可節省開發時間、版型一致，
            且支援手機、平板與桌機。
          </div>
        </div>
      </div>

      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#a3">
            本頁使用到的功能
          </button>
        </h2>
        <div id="a3" class="accordion-collapse collapse">
          <div class="accordion-body">
            使用了 Navbar、Collapse、Accordion，
            並搭配 JavaScript 實作即時搜尋功能。
          </div>
        </div>
      </div>

    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- 🔧 實用功能：即時搜尋 Accordion -->
<script>
  const searchInput = document.getElementById("searchInput");
  const items = document.querySelectorAll(".accordion-item");

  searchInput.addEventListener("input", function () {
    const keyword = this.value.toLowerCase();

    items.forEach(item => {
      const text = item.innerText.toLowerCase();
      item.style.display = text.includes(keyword) ? "block" : "none";
    });
  });
</script>

</body>
</html>
